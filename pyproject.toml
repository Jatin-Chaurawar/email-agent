[project]
name = "email-agent"
version = "0.1.0"
description = "Autonomous job email handling agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn",
    "imapclient",
    "google-api-python-client",
    "google-auth-oauthlib",
    "apscheduler",
    "beautifulsoup4",
    "cryptography",
    "pydantic",
    "pydantic-settings",
    "rich",
    "python-dotenv",
    "keyring",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]